services:
  - type: web
    runtime: static
    name: skillproof
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: VITE_APP_ENV
        value: production
      - key: VITE_GEMINI_API_KEY
        sync: false
